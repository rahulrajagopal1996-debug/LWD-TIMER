<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdown Timer</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
    .timer-box { display: inline-block; background: #fff; padding: 20px 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .unit { font-size: 24px; margin: 10px 0; }
    span { font-weight: bold; color: #2563eb; }
  </style>
</head>
<body>

  <div class="timer-box">
    <h2>Countdown to Sep 30, 2026</h2>
    <div class="unit">Days: <span id="days">0</span></div>
    <div class="unit">Total Hours: <span id="hours">0</span></div>
    <div class="unit"><span id="minsec">00 mins : 00 secs</span></div>
  </div>

  <script>
    const targetDate = new Date("Sep 30, 2026 16:00:00").getTime();

    const timer = setInterval(function() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance < 0) {
            clearInterval(timer);
            document.getElementById("days").innerText = "0";
            document.getElementById("hours").innerText = "0";
            document.getElementById("minsec").innerText = "Time's up!";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const totalHours = Math.floor(distance / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days;
        document.getElementById("hours").innerText = totalHours;
        document.getElementById("minsec").innerText = 
            String(minutes).padStart(2, '0') + " mins : " + 
            String(seconds).padStart(2, '0') + " secs";
    }, 1000);
  </script>
</body>
</html>
