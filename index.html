<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LWD Countdown Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a2233;
      color: #ffffff;
    }
    .card {
      background: #232d42;
      padding: 40px 48px;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 440px;
      width: 90%;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .target-date {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .timer-block {
      background: rgba(15, 23, 42, 0.6);
      padding: 14px 6px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .num {
      display: block;
      font-size: 28px;
      font-weight: 700;
      color: #facc15;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .time-banner {
      margin-top: 24px;
      font-size: 18px;
      font-weight: 600;
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>LWD Countdown</h1>
    <p class="target-date">Target: 30 September 2026, 5:00 PM</p>

    <div class="timer-grid">
      <div class="timer-block">
        <span id="days" class="num">0</span>
        <span class="label">Days</span>
      </div>
      <div class="timer-block">
        <span id="hours" class="num">0</span>
        <span class="label">Hours</span>
      </div>
      <div class="timer-block">
        <span id="minutes" class="num">0</span>
        <span class="label">Mins</span>
      </div>
      <div class="timer-block">
        <span id="seconds" class="num">0</span>
        <span class="label">Secs</span>
      </div>
    </div>

    <div id="full-string" class="time-banner">Calculating...</div>
  </div>

  <script>
    // Target Date: 30th September 2026, 5:00 PM (17:00:00)
    const targetDate = new Date("Sep 30, 2026 17:00:00").getTime();

    const timer = setInterval(function() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        clearInterval(timer);
        document.getElementById("days").innerText = "0";
        document.getElementById("hours").innerText = "0";
        document.getElementById("minutes").innerText = "0";
        document.getElementById("seconds").innerText = "0";
        document.getElementById("full-string").innerText = "Time's up!";
        return;
      }

      // Time breakdown calculations
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      // Populate grid tiles
      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = seconds;

      // Populate one-line combined output
      document.getElementById("full-string").innerText = 
        `${days} Days  ${hours} Hours  ${minutes} Mins  ${seconds} Secs`;
    }, 1000);
  </script>

</body>
</html>
